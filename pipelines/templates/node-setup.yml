# Installs Node and activates the pnpm version pinned by `packageManager` in the
# root package.json, via corepack. Keep `nodeVersion` on the same major as .nvmrc.
parameters:
  - name: nodeVersion
    type: string
    default: '22.x'

steps:
  - task: UseNode@1
    displayName: 'Install Node.js ${{ parameters.nodeVersion }}'
    inputs:
      version: ${{ parameters.nodeVersion }}

  - script: corepack enable
    displayName: 'corepack enable (pnpm)'
