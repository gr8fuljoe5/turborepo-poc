packages:
  - apps/*
  - services/*
  - packages/*

# One version of each shared dependency across every workspace. Packages
# reference these as `"react": "catalog:"`; bump the version here, not in a
# package.json.
catalog:
  '@primer/primitives': ^11.9.0
  '@primer/react': ^38.31.0
  '@storybook/addon-a11y': ^10.4.6
  '@storybook/addon-docs': ^10.4.6
  '@storybook/react-vite': ^10.4.6
  '@tailwindcss/vite': ^4.3.2
  '@tanstack/react-query': ^5.101.0
  '@tanstack/react-router': ^1.170.18
  '@testing-library/dom': ^10.4.1
  '@testing-library/jest-dom': ^6.9.1
  '@testing-library/react': ^16.3.2
  '@testing-library/user-event': ^14.6.1
  '@types/node': ^22.20.4
  '@types/react': ^19.2.17
  '@types/react-dom': ^19.2.3
  '@vitejs/plugin-react': ^6.0.2
  jsdom: ^29.1.1
  react: ^19.2.7
  react-dom: ^19.2.7
  # A peer of @primer/react. Every workspace that depends on @primer/react must
  # also list this, or pnpm satisfies the peer with pretty-format's react-is 17.
  react-is: ^19.2.7
  storybook: ^10.4.6
  tailwindcss: ^4.3.2
  typescript: ^6.0.3
  vite: ^8.0.16
  vitest: ^4.1.10

onlyBuiltDependencies:
  - esbuild
